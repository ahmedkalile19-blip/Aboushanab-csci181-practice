<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      main {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
      }

      #weather-output {
        margin-top: 20px;
        font-size: 1.5rem;
      }

      .loading {
        color: gray;
      }

      .error {
        color: red;
      }

      .temp {
        font-size: 3rem;
        font-weight: bold;
      }

      .forecast {
        font-size: 1.2rem;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Missoula Weather</h1>
      <div id="weather-output"></div>
    </main>
    <script src="scripts/weather.js" defer></script>
  </body>
</html>
